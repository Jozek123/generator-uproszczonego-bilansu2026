<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Konto T-owe - Zamykanie Konta</title>
  <style>
    .t-account {
      width: 360px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .t-header {
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .t-body {
      display: flex;
      position: relative;
      min-height: 120px;
    }

    /* Pionowa linia konta T */
    .t-body::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #000;
      transform: translateX(-50%);
    }

    .t-col {
      flex: 1;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
    }

    .col-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .col-title.dt { text-align: left; }
    .col-title.ct { text-align: right; }

    .entries-list {
      flex-grow: 1;
    }

    .entry {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.95em;
    }

    /* Jedno podkreślenie oddzielające wpisy od obrotów i salda */
    .single-underline {
      border-top: 1px solid #000;
      margin-top: 8px;
      padding-top: 4px;
    }

    .sum-row {
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 24px;
      margin-bottom: 2px;
    }

    .sk-row {
      color: #d93025;
    }

    /* Stylizacja pola input dla ręcznego wpisywania salda */
    .sk-input {
      width: 60px;
      text-align: right;
      font-weight: bold;
      color: #d93025;
      border: 1px dashed #ccc;
      border-radius: 4px;
      padding: 2px 4px;
      outline: none;
      font-size: 0.95em;
    }

    .sk-input:focus {
      border-color: #d93025;
      background-color: #fce8e6;
    }

    /* Ukrycie strzałek w polu typu number */
    .sk-input::-webkit-outer-spin-button,
    .sk-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .sk-input[type=number] {
      -moz-appearance: textfield;
    }

    .btn-close {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
    }

    .btn-close:hover {
      background-color: #2c5282;
    }
  </style>
</head>
<body>

<div class="t-account" id="account-1">
  <div class="t-header">Konto: Kasowe</div>
  
  <div class="t-body">
    <!-- Strona Debetowa (Dt) -->
    <div class="t-col">
      <div class="col-title dt">Dt</div>
      <div class="entries-list" id="dt-list">
        <div class="entry"><span>Sp.</span><span class="dt-val">1000</span></div>
        <div class="entry"><span>1.</span><span class="dt-val">500</span></div>
        <div class="entry"><span>2.</span><span class="dt-val">200</span></div>
      </div>
      
      <!-- Podsumowanie po stronie Dt -->
      <div class="single-underline">
        <div class="sum-row">
          <span>Obr.</span>
          <span id="dt-obroty"></span>
        </div>
        <div class="sum-row sk-row">
          <span>Sk.</span>
          <input type="number" class="sk-input" placeholder="..." />
        </div>
      </div>
    </div>

    <!-- Strona Kredytowa (Ct) -->
    <div class="t-col">
      <div class="col-title ct">Ct</div>
      <div class="entries-list" id="ct-list">
        <div class="entry"><span>3.</span><span class="ct-val">300</span></div>
        <div class="entry"><span>4.</span><span class="ct-val">100</span></div>
      </div>
      
      <!-- Podsumowanie po stronie Ct -->
      <div class="single-underline">
        <div class="sum-row">
          <span>Obr.</span>
          <span id="ct-obroty"></span>
        </div>
        <div class="sum-row sk-row">
          <span>Sk.</span>
          <input type="number" class="sk-input" placeholder="..." />
        </div>
      </div>
    </div>
  </div>

  <button class="btn-close" onclick="zamknijKonto()">Zamknij konto</button>
</div>

<script>
  function zamknijKonto() {
    // 1. Zliczanie obrotów Dt
    const dtValues = document.querySelectorAll('#dt-list .dt-val');
    let sumDt = 0;
    dtValues.forEach(el => {
      sumDt += parseFloat(el.textContent) || 0;
    });

    // 2. Zliczanie obrotów Ct
    const ctValues = document.querySelectorAll('#ct-list .ct-val');
    let sumCt = 0;
    ctValues.forEach(el => {
      sumCt += parseFloat(el.textContent) || 0;
    });

    // 3. Wpisanie zsumowanych obrotów do widoku
    document.getElementById('dt-obroty').textContent = sumDt;
    document.getElementById('ct-obroty').textContent = sumCt;
  }
</script>

</body>
</html>
